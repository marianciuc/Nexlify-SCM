apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexlify-ingress
  namespace: nexlify
  labels:
    app.kubernetes.io/name: nexlify-ingress
    app.kubernetes.io/part-of: nexlify-scm
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: nexlify.local
      http:
        paths:
          # Microservices routing via Spring Cloud Gateway
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /actuator/
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          # Frontend SPA client routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
