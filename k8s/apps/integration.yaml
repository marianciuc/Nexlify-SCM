apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration
  namespace: nexlify
  labels:
    app.kubernetes.io/name: integration
    app.kubernetes.io/component: integration-service
    app.kubernetes.io/part-of: nexlify-scm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: integration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integration
        app.kubernetes.io/component: integration-service
        app.kubernetes.io/part-of: nexlify-scm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: integration
          image: ghcr.io/marianciuc/nexlify-scm/integration:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexlify-config
            - secretRef:
                name: nexlify-secrets
          env:
            - name: SERVER_PORT
              value: "8089"
            - name: SPRING_APPLICATION_NAME
              value: "integration"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8089
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 4
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8089
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: integration
  namespace: nexlify
  labels:
    app.kubernetes.io/name: integration
    app.kubernetes.io/component: integration-service
    app.kubernetes.io/part-of: nexlify-scm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8089
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: integration
