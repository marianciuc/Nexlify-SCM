apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexlify

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - ingress.yaml
  - apps/frontend.yaml
  - apps/gateway.yaml
  - apps/users.yaml
  - apps/orders.yaml
  - apps/inventory.yaml
  - apps/logistic.yaml
  - apps/billing.yaml
  - apps/analytics.yaml
  - apps/notification.yaml
  - apps/rfq.yaml
  - apps/integration.yaml

commonLabels:
  app.kubernetes.io/part-of: nexlify-scm
  app.kubernetes.io/managed-by: kustomize
