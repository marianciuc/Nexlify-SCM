<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40" fill="none">
  <!-- Brand Icon Squircle Container -->
  <g transform="translate(4, 4)">
    <rect width="32" height="32" rx="7" fill="currentColor"/>
    
    <!-- Left Logistics Pillar -->
    <rect x="6" y="6" width="5.5" height="20" rx="1.5" fill="var(--color-background, #ffffff)"/>
    
    <!-- Right Logistics Pillar -->
    <rect x="20.5" y="6" width="5.5" height="20" rx="1.5" fill="var(--color-background, #ffffff)"/>
    
    <!-- Diagonal Logistics Beam -->
    <path d="M10 6.5C10.5 5.8 11.4 5.8 12 6.5L21.5 21.5C22 22.2 21.6 23 20.7 23H17.8C17.2 23 16.6 22.6 16.3 22L9.2 10.5C8.7 9.7 9.1 8.8 10 8.8L10 6.5Z" fill="var(--color-muted-foreground, #a1a1aa)"/>
    
    <!-- Telemetry Status Node -->
    <circle cx="23.25" cy="8.75" r="1.75" fill="#10b981"/>
  </g>
  
  <!-- Wordmark "Nexlify" -->
  <text x="44" y="25" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.03em" fill="currentColor">
    Nexlify
  </text>
  
  <!-- Subtitle Badge "SCM" -->
  <g transform="translate(108, 12)">
    <rect width="36" height="17" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <rect x="0.5" y="0.5" width="35" height="16" rx="3.5" stroke="currentColor" stroke-opacity="0.15"/>
    <text x="18" y="12" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.06em" fill="currentColor" text-anchor="middle">
      SCM
    </text>
  </g>
</svg>