services:

  ## Consul ##
  consul-server:
    image: hashicorp/consul:1.15
    container_name: consul-server
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    command: agent -server -data-dir=/consul/data -bootstrap-expect=1 -ui -client 0.0.0.0
    restart: always
    networks:
      - nexlify-network

  ## Redis ##
  redis:
    image: redis:7.2-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - nexlify-network

  ## PostgreSQL ##
  postgres:
    image: postgres:16.1
    container_name: nexlify-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexlify-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - nexlify-network

  ## Keycloak 26.x IAM with Realm Auto-import ##
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: nexlify-keycloak
    command: start-dev --import-realm
    ports:
      - "9090:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://nexlify-db:5432/nexlify-db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_DB_SCHEMA: public
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: 8080
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    restart: always
    networks:
      - nexlify-network
    depends_on:
      - postgres

  ## Apache Kafka (KRaft mode) ##
  kafka:
    image: apache/kafka:3.7.0
    container_name: nexlify-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - nexlify-network

networks:
  nexlify-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  consul_data:
    driver: local
  postgres-data:
    driver: local
  kafka_data:
    driver: local