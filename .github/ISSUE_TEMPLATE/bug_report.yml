# Bug Report Template (YAML Format)
#
# YAML form format gives required-field validation, dropdowns for consistent
# triage data, and a better UX than Markdown templates.

name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - marianciuc

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out this form as completely as possible.

  - type: checkboxes
    id: pre-checks
    attributes:
      label: Pre-submission Checks
      description: Please confirm you've completed these steps
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have tested this on the latest version
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the bug occur?
      options:
        - Frontend (React/Vite)
        - Backend — Gateway
        - Backend — inventory
        - Backend — orders
        - Backend — logistic
        - Backend — users
        - Backend — billing
        - Backend — analytics
        - Backend — notification
        - Backend — rfq
        - Backend — integration
        - Infrastructure (Docker / K8s / CI)
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: "When I click the submit button, the form doesn't validate..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: "The form should validate and display success message..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: "Instead, I see an error: 'Network request failed'..."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (blocks all functionality)
        - High (major feature broken)
        - Medium (feature partially works)
        - Low (minor issue or cosmetic)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Provide details about your environment:
        - OS: [e.g. Windows 11, macOS 14, Ubuntu 24.04]
        - Browser: [e.g. Chrome 120, Firefox 121] (for frontend issues)
        - Environment: [e.g. local docker compose, staging, production]
      placeholder: |
        - OS: Ubuntu 24.04
        - Browser: Chrome 120
        - Environment: local docker compose
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Paste any relevant error logs or console output
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots or videos to help explain the problem
      placeholder: Drag and drop images/videos here

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
