name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build UserService artifact
        working-directory: backend/UserService
        run: mvn -B clean package -DskipTests

      - name: Build Gateway artifact
        working-directory: backend/Gateway
        run: mvn -B clean package -DskipTests

      - name: Create GitHub release with jars
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/UserService/target/*.jar
            backend/Gateway/target/*.jar
          generate_release_notes: true
