name: Nexlify-SCM CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Frontend Verification Job
  # ============================================================================
  frontend-check:
    name: Frontend Quality & Build Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Validate i18n translations
        working-directory: frontend
        run: pnpm validate:locale

      - name: Generate translation types
        working-directory: frontend
        run: pnpm generate:locale-types

      - name: TypeScript type checking
        working-directory: frontend
        run: pnpm typecheck

      - name: Production Vite build
        working-directory: frontend
        run: pnpm build

  # ============================================================================
  # Backend Services Compilation & Unit Tests Matrix Job
  # ============================================================================
  backend-matrix:
    name: Backend Service Build (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - Gateway
          - inventory
          - orders
          - logistic
          - users
          - billing
          - analytics
          - notification
          - rfq
          - integration
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-read-only: false

      - name: Build and Test ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: |
          chmod +x ./gradlew
          ./gradlew test bootJar --no-daemon

  # ============================================================================
  # Kubernetes Manifest Validation
  # ============================================================================
  k8s-validate:
    name: Kubernetes Manifests Dry-Run
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f  # v2

      - name: Validate Kustomize Build
        run: |
          kustomize build k8s/ > /dev/null
          echo "Kustomize manifests verified successfully."
