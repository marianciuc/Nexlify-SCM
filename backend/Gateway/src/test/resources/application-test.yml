spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service-api
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**, /api/v1/companies/**
            - id: user-service-openapi
              uri: http://localhost:8081
              predicates:
                - Path=/user-service/v3/api-docs/**
              filters:
                - RewritePath=/user-service/(?<remaining>.*), /${remaining}
            - id: fallback
              uri: lb://gateway
              predicates:
                - Path=/fallback/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/LogisticCommerce/protocol/openid-connect/certs

server:
  port: 0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: "API Gateway"
        url: /v3/api-docs
      - name: "Aggregated Platform API"
        url: /v3/api-docs/aggregated
      - name: "User Service"
        url: /user-service/v3/api-docs

gateway:
  openapi:
    aggregation:
      enabled: true
      excluded-services:
        - consul
        - keycloak
        - gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info
