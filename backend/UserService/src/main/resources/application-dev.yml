# Development environment configuration
spring:
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        instance-id: ${spring.application.name}:${random.value}
        service-name: ${spring.application.name}
        healthCheckPath: /actuator/health
        healthCheckInterval: 15s
        prefer-ip-address: true
        ip-address: 127.0.0.1
        hostname: 127.0.0.1
        scheme: http
        register: true
        deregister: true
        fail-fast: false
        health-check-url: http://localhost:${server.port:8080}/actuator/health

      config:
        enabled: true
        format: yaml
        data-key: application.yml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/LogisticCommerce
  datasource:
    url: jdbc:postgresql://localhost:5432/scm?currentSchema=user_service
    username: ${SPRING_DB_USERNAME:postgres}
    password: ${SPRING_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: ${SPRING_DB_USERNAME:postgres}
    password: ${SPRING_DB_PASSWORD:postgres}
  web:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600


keycloak:
  server-url: http://localhost:9090
  security:
    token:
      refresh:
        lifetime: 86400 # 24 hours for development
      access:
        lifetime: 3600 # 1 hour for development (longer than prod)

ip:
  api:
    url: http://ip-api.com/json

# Development-specific settings
logging:
  level:
    works.marianciuc.logistic_commerce: DEBUG
    org.springframework.security: DEBUG

init:
  keycloak:
    roles: false
    realm: false
    recreate:
      realm: false # Allow realm recreation in dev