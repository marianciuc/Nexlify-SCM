# Production environment configuration
spring:
  cloud:
    consul:
      host: ${CONSUL_HOST:consul.internal}
      port: ${CONSUL_PORT:8500}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.logisticcommerce.com/realms/LogisticCommerce}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:https://keycloak.logisticcommerce.com}
  security:
    token:
      refresh:
        max-reuse: 0
        can-be-revoked: true
        lifetime: 86400 # 24 hours
      access:
        lifetime: 300 # 5 minutes for production (strict security)

ip:
  api:
    url: ${IP_API_URL:http://ip-api.com/json}

# Production-specific settings
logging:
  level:
    works.marianciuc.logistic_commerce: WARN
    org.springframework.security: ERROR
    org.springframework.web: ERROR
    org.springframework.cloud: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

init:
  keycloak:
    roles: false # Don't initialize roles in production
    realm: false # Don't initialize realm in production
    recreate:
      realm: false # Never recreate realm in production

# Production security settings
management:
  endpoints:
    web:
      exposure:
        include: health,info # Only expose essential endpoints