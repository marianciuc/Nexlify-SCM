# Staging environment configuration
spring:
  cloud:
    consul:
      host: ${CONSUL_HOST:consul-staging.internal}
      port: ${CONSUL_PORT:8500}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak-staging.logisticcommerce.com/realms/LogisticCommerce}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:https://keycloak-staging.logisticcommerce.com}
  security:
    token:
      refresh:
        lifetime: 43200 # 12 hours for staging
      access:
        lifetime: 900 # 15 minutes for staging

ip:
  api:
    url: ${IP_API_URL:http://ip-api.com/json}

# Staging-specific settings
logging:
  level:
    works.marianciuc.logistic_commerce: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

init:
  keycloak:
    roles: true
    realm: true
    recreate:
      realm: false # Don't recreate realm in staging