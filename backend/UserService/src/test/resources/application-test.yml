spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
      config:
        enabled: false
  config:
    import: "optional:file:./config/"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

keycloak:
  server-url: http://localhost:9090
  default-client:
    realm: LogisticCommerce
    client-id: application-client
    client-secret: test-secret
  admin:
    realm: master
    client-id: admin-cli
    client-secret: test-secret
    username: test-admin
    password: test-password
  security:
    token:
      access:
        lifetime: 300
      refresh:
        lifetime: 86400
        max-reuse: 0
        can-be-revoked: true

init:
  keycloak:
    roles: false
    realm: false
    recreate:
      realm: false

logging:
  level:
    org.springframework.security: DEBUG
    works.marianciuc.logistic_commerce.userservice: DEBUG