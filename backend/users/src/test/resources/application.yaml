server:
  port: 0

spring:
  application:
    name: users-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    consul:
      enabled: false
      config:
        enabled: false
      discovery:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092
