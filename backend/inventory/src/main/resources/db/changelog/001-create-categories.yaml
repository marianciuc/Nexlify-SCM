databaseChangeLog:
  - changeSet:
      id: 001-create-categories
      author: nexlify-scm
      changes:
        - createTable:
            schemaName: inventory
            tableName: categories
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: varchar(200)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: text
              - column:
                  name: parent_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_category_parent
                    references: inventory.categories(id)
              - column:
                  name: sort_order
                  type: int
                  defaultValueNumeric: 0
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
        - createIndex:
            schemaName: inventory
            tableName: categories
            indexName: idx_category_parent_id
            columns:
              - column:
                  name: parent_id
        - createIndex:
            schemaName: inventory
            tableName: categories
            indexName: idx_category_slug
            columns:
              - column:
                  name: slug
